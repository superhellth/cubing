name: Publish to GHCR

on:
  push:
    branches: [main]
    paths: &paths
      - packages/frontend/**
      - packages/shared/**
      - packages/backend/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - generate-licenses.js
      - .dockerignore
      - Dockerfile
      - .github/workflows/publish.yaml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cubing/frontend build
      - run: pnpm --filter @cubing/backend... build

  version:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      is_new: ${{ steps.read.outputs.is_new }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: version
    runs-on: ubuntu-latest
    if: needs.version.outputs.is_new == 'true'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: frontend
            image: ghcr.io/superhellth/cubing
          - target: backend
            image: ghcr.io/superhellth/cubing-backend
          - target: visualcube
            image: ghcr.io/superhellth/cubing-visualcube
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:sha-${{ github.sha }}
            ${{ matrix.image }}:${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  tag:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
