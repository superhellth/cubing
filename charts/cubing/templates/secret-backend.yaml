{{- if not (or .Values.backend.dbConfig.existingSecret .Values.backend.dbConfig.password) }}
{{ fail "set backend.dbConfig.existingSecret or backend.dbConfig.password" }}
{{- end }}
{{- if and (not .Values.backend.dbConfig.existingSecret) .Values.backend.dbConfig.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cubing.dbSecretName" . }}
  labels:
    {{- include "cubing.componentLabels" (dict "context" $ "component" "backend") | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.backend.dbConfig.passwordKey }}: {{ .Values.backend.dbConfig.password | quote }}
{{- end }}