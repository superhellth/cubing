apiVersion: apps/v1
kind: Deployment
metadata:
  name: cubing-backend
  labels:
    {{- include "cubing.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels: 
      {{- include "cubing.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels: 
        {{- include "cubing.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        {{- .Values.podSecurityContext | toYaml | nindent 8 }}
      terminationGracePeriodSeconds: 5
      initContainers:
        - name: migrate
          image: "ghcr.io/superhellth/cubing-backend:{{ .Chart.AppVersion }}"
          command:
            - node_modules/.bin/node-pg-migrate
            - up
            - -m
            - migrations
            - --advisory-lock-mode
            - wait
          envFrom:
            - configMapRef: { name: cubing-backend-config }
            - secretRef: { name: cubing-backend-secrets }
          env:
            - { name: PGHOST, value: $(DB_HOST) }
            - { name: PGPORT, value: $(DB_PORT) }
            - { name: PGDATABASE, value: $(DB_NAME) }
            - { name: PGUSER, value: $(DB_USER) }
            - { name: PGPASSWORD, value: $(DB_PASSWORD) }
          securityContext:
            {{- .Values.securityContext | toYaml | nindent 12 }}
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
      containers:
        - name: cubing-backend
          image: "ghcr.io/superhellth/cubing-backend:{{ .Chart.AppVersion }}"
          ports: [{ name: http, containerPort: 3000 }]
          securityContext:
            {{- .Values.securityContext | toYaml | nindent 12 }}
          envFrom:
            - configMapRef: { name: cubing-backend-config }
            - secretRef: { name: cubing-backend-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 384Mi }
