{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cubing.fullname" $ }}
  labels:
    {{- include "cubing.labels" $ | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames:
    {{- required "httpRoute.hostnames must not be empty" .Values.httpRoute.hostnames | toYaml | nindent 4 }}
  rules:
    - backendRefs:
        - name: {{ include "cubing.componentName" (dict "context" $ "component" "frontend") }}
          port: 80
{{- end }}