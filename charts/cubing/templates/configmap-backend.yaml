apiVersion: v1
kind: ConfigMap
metadata:
  name: cubing-backend-config
  labels:
    {{- include "cubing.componentLabels" (dict "context" $ "component" "backend") | nindent 4 }}
data:
  DB_HOST: {{ .Values.backend.dbConfig.host | quote }}
  DB_PORT: {{ .Values.backend.dbConfig.port | quote }}
  DB_NAME: {{ .Values.backend.dbConfig.name | quote }}
  DB_USER: {{ .Values.backend.dbConfig.user | quote }}