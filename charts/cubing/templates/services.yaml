---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubing.componentName" (dict "context" $ "component" "frontend") }}
  labels:
    {{- include "cubing.componentLabels" (dict "context" $ "component" "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "cubing.componentSelectorLabels" (dict "context" $ "component" "frontend") | nindent 4 }}
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubing.componentName" (dict "context" $ "component" "backend") }}
  labels:
    {{- include "cubing.componentLabels" (dict "context" $ "component" "backend") | nindent 4 }}
spec:
  selector: 
    {{- include "cubing.componentSelectorLabels" (dict "context" $ "component" "backend") | nindent 4 }}
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cubing.componentName" (dict "context" $ "component" "visualcube") }}
  labels:
    {{- include "cubing.componentLabels" (dict "context" $ "component" "visualcube") | nindent 4 }}
spec:
  selector: 
    {{- include "cubing.componentSelectorLabels" (dict "context" $ "component" "visualcube") | nindent 4 }}
  ports: [{ name: http, port: 80, targetPort: http }]
