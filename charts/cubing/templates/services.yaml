---
apiVersion: v1
kind: Service
metadata:
  name: cubing-frontend
  labels:
    {{- include "cubing.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "cubing.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "cubing.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector: 
    {{- include "cubing.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata:
  name: visualcube
  labels:
    {{- include "cubing.labels" . | nindent 4 }}
    app.kubernetes.io/component: visualcube
spec:
  selector: 
    {{- include "cubing.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: visualcube
  ports: [{ name: http, port: 80, targetPort: http }]
